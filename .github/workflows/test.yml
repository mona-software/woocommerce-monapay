name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2" }
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/test-signature.php
      - run: php tests/test-return-signature.php
      - run: php tests/test-oauth.php
      - run: php tests/test-qr.php /tmp/monapay-test-qr.png
      - run: node --check assets/js/admin-settings.js
